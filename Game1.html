<!DOCTYPE html>
<html>
<head>
    <title>Play Slope!</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0; /* Remove default body margin */
            padding: 0; /* Remove default body padding */
            overflow: hidden; /* Hide scrollbars if content is larger than window */
            background-color: #000; /* Optional: black background */
        }

        /* Style for the container of the iframe */
        .game-container {
            width: 100%;
            height: 100vh; /* Make container full height of the viewport */
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
        }

        /* Style for the iframe itself */
        .game-iframe {
            width: 100%; /* Adjust width as needed, maybe a fixed size */
            height: 100%; /* Adjust height as needed, maybe a fixed size */
            border: none; /* Remove border */
        }

        /* Optional: Style for a back button */
        .back-button {
            position: absolute; /* Position relative to the nearest positioned ancestor */
            top: 10px; /* Distance from the top */
            left: 10px; /* Distance from the left */
            display: inline-block;
            padding: 8px 15px;
            font-size: 14px;
            text-decoration: none;
            color: white;
            background-color: #6c757d;
            border-radius: 4px;
            z-index: 10; /* Ensure the button is above the iframe */
        }

        .back-button:hover {
            background-color: #5a6268;
        }

    </style>
</head>
<body>

    <a href="index.html" class="back-button">Back to Home</a>


    <div class="game-container">
        <iframe
            class="game-iframe"
            src="URL_WHERE_SLOPE_IS_HOSTED_AND_EMBEDDABLE"
            title="Slope Game"
            allowfullscreen
            frameborder="0">
        </iframe>
    </div>

</body>
</html>
