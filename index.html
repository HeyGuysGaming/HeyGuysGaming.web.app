<!DOCTYPE html>
<html>
<head>
    <title>My Games Website</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center; /* Center content horizontally */
            margin-top: 50px; /* Add some space from the top */
        }

        h1 {
            color: #333; /* Dark grey color for the heading */
        }

        p {
            color: #666; /* Medium grey color for paragraph */
            margin-bottom: 30px; /* Space below the paragraph */
        }

        .button-container {
            margin-top: 20px; /* Space above the buttons */
        }

        .button {
            display: inline-block; /* Arrange buttons side-by-side */
            padding: 12px 24px; /* Adjust padding for slightly larger buttons */
            margin: 10px; /* Space between buttons */
            font-size: 18px; /* Slightly larger font */
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Welcome to Hey Guys Gaming!</h1>

    <p>Choose a game to play and waste time!:</p>

    <div class="button-container">
        <a href="game1.html" class="button">Slope</a>

        <a href="game2.html" class="button">Slope 2</a>

        <a href="game3.html" class="button">Geometry Dash</a>

        </div>

</body>
</html>
